name: Release (build from source + publish)

# Triggered by pushing a version tag (vMAJOR.MINOR.PATCH) at the current tip
# of main. This workflow:
#   1. Bumps every version field in app_config.h to match the tag, commits
#      that to main, and moves the tag to point at the new commit — so the
#      tag, the released binary, and the committed source always agree.
#   2. Builds the app from source with slc-cli (tools/slc-install.sh +
#      tools/slc-build.sh) instead of requiring a Studio-built binary pushed
#      into ota/.
#   3. Reuses create_ota.py / build_ota_index.py exactly as before — they
#      only care that a .s37/.hex sit in ota/, not how they got there. Their
#      existing gates (app doesn't overrun the OTA slot; the compressed .ota
#      fits the slot) are what actually prove the build fits both flash
#      regions; nothing here bypasses them.
#
# Replaces the old build-ota.yml, which triggered off a Studio-built binary
# being pushed into ota/ — that workflow is retired now that the binary is
# built here instead.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

env:
  MODEL_ID: TS1001_TYZB01_7qf81wty_Enhanced
  MANUFACTURER_NAME: DIY-Immax

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sanity-check the tag was cut from main
        run: |
          TAG_SHA="${{ github.sha }}"
          if ! git merge-base --is-ancestor "$TAG_SHA" HEAD; then
            echo "!! tag ${{ github.ref_name }} (commit $TAG_SHA) is not an ancestor of main." >&2
            echo "!! push release tags from the current tip of main." >&2
            exit 1
          fi

      - name: Bump version fields to match the tag
        run: python .github/scripts/bump_version.py --tag "${{ github.ref_name }}"

      - name: Slot geometry check (before spending time on a build)
        run: python .github/scripts/check_slot_geometry.py

      - name: Commit the version bump and move the tag
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Zigbee-Remote-_TYZB01_7qf81wty/app_config.h \
                  Zigbee-Remote-_TYZB01_7qf81wty/config/ota-client-policy-config.h
          if git diff --cached --quiet; then
            echo "!! bump_version.py made no changes — did the tag match the already-committed version?" >&2
            exit 1
          fi
          git commit -m "${{ github.ref_name }}: version bump [skip ci]"
          git push origin HEAD:main
          # Move the release tag to the bump commit, so the tag, the built
          # binary, and the committed source all agree on the version. This
          # force-updates the tag ref on purpose — same pattern release
          # automation tools like release-please/semantic-release use for a
          # tag that's meant to always point at its release commit.
          git tag -f "${{ github.ref_name }}"
          git push --force origin "refs/tags/${{ github.ref_name }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache slc-cli / toolchain / gecko_sdk
        uses: actions/cache@v4
        with:
          path: tools/.cache
          key: slc-tools-${{ hashFiles('tools/slc-install.sh') }}

      - name: Install slc-cli + toolchain + SDK
        run: tools/slc-install.sh

      - name: Build the app from source
        run: tools/slc-build.sh Zigbee-Remote-_TYZB01_7qf81wty EFR32MG13P732F512GM48 build/app

      - name: Stage the build output where create_ota.py expects it
        run: |
          mkdir -p ota
          cp build/app/artifacts/*.s37 ota/ 2>/dev/null || true
          cp build/app/artifacts/*.hex ota/ 2>/dev/null || true
          ls -la ota/

      - name: Cache Simplicity Commander
        id: cache-commander
        uses: actions/cache@v4
        with:
          path: commander
          key: simplicity-commander-linux-2024

      - name: Download Simplicity Commander
        if: steps.cache-commander.outputs.cache-hit != 'true'
        run: |
          wget -q -O commander.zip https://www.silabs.com/documents/login/software/SimplicityCommander-Linux.zip
          unzip -q commander.zip -d commander_zip
          tar -xf commander_zip/SimplicityCommander-Linux/Commander_linux_x86_64_*.tar.bz* -C .
          rm -rf commander_zip commander.zip

      - name: Add Commander to PATH
        run: echo "${GITHUB_WORKSPACE}/commander" >> $GITHUB_PATH

      - name: Build the .ota from the freshly-built firmware
        id: ota
        run: python .github/scripts/create_ota.py

      - name: Build the Zigbee2MQTT OTA index
        if: steps.ota.outputs.released == 'true'
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.ota.outputs.tag }}/${{ steps.ota.outputs.ota_name }}"
          python .github/scripts/build_ota_index.py "${{ steps.ota.outputs.ota_path }}" \
            --url "$URL" \
            --model-id "${MODEL_ID}" \
            --manufacturer-name "${MANUFACTURER_NAME}" \
            --out dist/index.json
          cat dist/index.json

      - name: Publish the GitHub Release
        if: steps.ota.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ota.outputs.tag }}
          HEX_PATH: ${{ steps.ota.outputs.hex_path }}
        run: |
          # The .hex is optional: a release without one simply has no
          # wired-flash image for that version.
          HEX_ASSET=""
          [ -n "$HEX_PATH" ] && HEX_ASSET="$HEX_PATH"
          # Re-runs must not fail: if the tag/release already exists, overwrite
          # its assets instead of erroring out.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists - updating its assets."
            gh release upload "$TAG" \
              "${{ steps.ota.outputs.ota_path }}" dist/index.json $HEX_ASSET \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" \
              "${{ steps.ota.outputs.ota_path }}" dist/index.json $HEX_ASSET \
              --title "$TAG" \
              --notes "Firmware ${TAG} for the TS1001_TYZB01_7qf81wty_Enhanced remote.

          Built from source by GitHub Actions (tools/slc-install.sh + tools/slc-build.sh).

          Zigbee2MQTT picks this up automatically via:
          \`https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/index.json\`" \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Verify the published assets
        if: steps.ota.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ota.outputs.tag }}
        run: |
          # Fetch back what was actually published and prove it matches what we
          # built - a mismatched index is exactly what breaks an OTA at 99%.
          mkdir -p verify
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir verify --clobber
          python - <<'PY'
          import hashlib, json, pathlib, struct, sys
          d = pathlib.Path("verify")
          hexes = [p for p in d.iterdir() if p.suffix == ".hex"]
          print(f"  assets: {sorted(p.name for p in d.iterdir())}")
          index = json.loads((d / "index.json").read_text())
          assert len(index) == 1, f"expected 1 index entry, got {len(index)}"
          e = index[0]
          ota = next(p for p in d.iterdir() if p.suffix == ".ota")
          data = ota.read_bytes()
          hdr = struct.Struct("<I5HIH32sI")
          magic, _, _, _, mfg, itype, fver, _, _, total = hdr.unpack(data[:hdr.size])
          checks = {
              "ota magic":        magic == 0x0BEEF11E,
              "totalImageSize":   total == len(data),
              "index fileSize":   e["fileSize"] == len(data),
              "index fileVersion": e["fileVersion"] == fver,
              "index mfgCode":    e["manufacturerCode"] == mfg,
              "index imageType":  e["imageType"] == itype,
              "index sha512":     e["sha512"] == hashlib.sha512(data).hexdigest(),
              "url points at asset": e["url"].endswith(ota.name),
              "payload is a GBL": data[62:66] == bytes.fromhex("eb17a603"),
          }
          # The wired-flash image must be real Intel HEX and carry the same
          # version in its name as the .ota, or fetch.sh will 404 on it.
          if hexes:
              h = hexes[0]
              checks["hex is Intel HEX"] = h.read_bytes()[:1] == b":"
              checks["hex version matches ota"] = (
                  h.stem.rsplit("-v", 1)[-1] == ota.stem.rsplit("-v", 1)[-1])
          for k, ok in checks.items():
              print(f"  {'OK  ' if ok else 'FAIL'} {k}")
          if not all(checks.values()):
              sys.exit("published assets are inconsistent")
          print(f"verified {ota.name}: fileVersion=0x{fver:08X} size={total}")
          PY
